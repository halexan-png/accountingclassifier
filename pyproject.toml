[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gna-pipeline"
version = "0.1.0"
description = "GNL G&A Non-Recurring Classifier pipeline"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.112.0",
    "openpyxl>=3.1.5",
    "pyxlsb>=1.0.10",
    "pypdf>=6.14.2",
    "msal>=1.37.0",
]

[project.optional-dependencies]
# The local web UI server (gna_server/, Wave 2+) — nothing in gna_pipeline
# itself depends on these; install with `pip install -e .[ui]`.
ui = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "python-multipart",
]

[project.scripts]
gna-pipeline = "gna_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["gna_pipeline*"]
